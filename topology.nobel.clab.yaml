name: p4-nobel-lab

mgmt:
  network: clab-nobel-mgmt
  ipv4-subnet: 172.20.21.0/24

topology:
  nodes:
    ams:
      kind: linux
      image: p4lang/behavioral-model:latest
      mgmt-ipv4: 172.20.21.101
      binds:
        - basic_forwarding.json:/root/basic_forwarding.json
      sysctls:
        net.ipv4.ip_forward: 0
        net.ipv6.conf.all.forwarding: 0
      exec:
        - sysctl -qw net.ipv4.ip_forward=0 net.ipv6.conf.all.forwarding=0
      cmd: >
        bash -c "sleep 2 &&
        simple_switch_grpc
        --thrift-port 9091
        --device-id 1
        -i 1@eth1 -i 2@eth2 -i 3@eth3
        /root/basic_forwarding.json
        --
        --grpc-server-addr 0.0.0.0:9559"

    ams-frr:
      kind: linux
      image: frrouting/frr:latest
      network-mode: container:ams
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/nobel/ams/frr.conf:/etc/frr/frr.conf
      exec:
        - sysctl -qw net.ipv4.ip_forward=0 net.ipv6.conf.all.forwarding=0
        - apk add --no-cache tcpdump
        - iptables -A OUTPUT -p icmp --icmp-type destination-unreachable -j DROP
        - tc qdisc replace dev eth1 root tbf rate 5mbit burst 16kb latency 50ms
        - tc qdisc replace dev eth2 root tbf rate 5mbit burst 16kb latency 50ms
        - tc qdisc replace dev eth3 root tbf rate 5mbit burst 16kb latency 50ms

