---
- name: "Scenariusz 1: Topologia asymetryczna syntetyczna (UCMP 10 vs 20, TCP Throughput + FCT)"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    mode: "famtar"
    scenario_id: "scenario1_ucmp"
    runs: 5
    flow1_rate: "9.4M"
    flow2_rate: "9.4M"
    flow_bytes: "15M"
    stagger_sec: 2
    target_ip: "10.0.2.1"
    project_root: "{{ (playbook_dir ~ '/../..') | realpath }}"
    results_dir: "{{ project_root }}/results/{{ scenario_id }}_{{ mode }}"

  tasks:
    - name: Wyświetlenie parametrów testu
      ansible.builtin.debug:
        msg: >
          Uruchamianie {{ scenario_id }} | Tryb: {{ mode | upper }} | Powtórzenia: {{ runs }} |
          Rozmiar przepływu: {{ flow_bytes }} (limit {{ flow1_rate }}/{{ flow2_rate }}) | Katalog: {{ results_dir }}

    - name: Przygotowanie czystego katalogu na wyniki
      ansible.builtin.shell: |
        rm -rf "{{ results_dir }}/run_"* "{{ results_dir }}/summary.json"
        mkdir -p "{{ results_dir }}"
      changed_when: true

    - name: Upewnienie się, że serwery iperf3 działają na h2
      ansible.builtin.shell: |
        docker exec clab-p4-basic-lab-h1 pkill -f iperf3 2>/dev/null || true
        docker exec clab-p4-basic-lab-h2 pgrep -f "iperf3 -s -p 5201" >/dev/null || docker exec clab-p4-basic-lab-h2 iperf3 -s -p 5201 -D
        docker exec clab-p4-basic-lab-h2 pgrep -f "iperf3 -s -p 5202" >/dev/null || docker exec clab-p4-basic-lab-h2 iperf3 -s -p 5202 -D
      changed_when: false

    - name: "Wykonanie {{ runs }} serii pomiarowych TCP (Throughput + Flow Completion Time)"
      ansible.builtin.shell: |
        set -e
        for run_idx in $(seq 1 {{ runs }}); do
          RUN_DIR="{{ results_dir }}/run_${run_idx}"
          mkdir -p "$RUN_DIR"
          echo "=== [{{ scenario_id }}:{{ mode }}] Seria ${run_idx}/{{ runs }} ==="

          # 1. Reset rejestrów P4 (FFT oraz liczników portów)
          for item in "r1:9090" "r2:9091" "r3:9092" "r4:9093"; do
            R="${item%%:*}"
            PORT="${item##*:}"
            docker exec -i "clab-p4-basic-lab-$R" simple_switch_CLI --thrift-port "$PORT" << 'EOF' >/dev/null
        register_reset MyIngress.reg_signature
        register_reset MyIngress.reg_egress_port
        register_reset MyIngress.reg_saved_ttl
        register_reset MyIngress.reg_timestamp
        counter_reset MyIngress.port_bytes_counter
        EOF
          done

          # 2. Przywrócenie asymetrycznych metryk IS-IS (Ścieżka 1 przez r2 = 10, Ścieżka 2 przez r3 = 20)
          docker exec clab-p4-basic-lab-r1-frr vtysh -c "conf t" -c "router isis FAMTAR" -c "lsp-gen-interval 1" -c "spf-interval 1" -c "interface eth2" -c "isis metric 10" -c "interface eth3" -c "isis metric 20" >/dev/null
          docker exec clab-p4-basic-lab-r2-frr vtysh -c "conf t" -c "router isis FAMTAR" -c "lsp-gen-interval 1" -c "spf-interval 1" -c "interface eth1" -c "isis metric 10" -c "interface eth2" -c "isis metric 10" >/dev/null
          docker exec clab-p4-basic-lab-r3-frr vtysh -c "conf t" -c "router isis FAMTAR" -c "lsp-gen-interval 1" -c "spf-interval 1" -c "interface eth1" -c "isis metric 20" -c "interface eth2" -c "isis metric 20" >/dev/null
          docker exec clab-p4-basic-lab-r4-frr vtysh -c "conf t" -c "router isis FAMTAR" -c "lsp-gen-interval 1" -c "spf-interval 1" -c "interface eth2" -c "isis metric 10" -c "interface eth3" -c "isis metric 20" >/dev/null

          # Odczekanie na wygaszenie hold_down_s (2s) i zbieżność IS-IS
          sleep 4

          # 3. Start tcpdump na r2 i r3
          docker exec clab-p4-basic-lab-r2-frr pkill -f tcpdump 2>/dev/null || true
          docker exec clab-p4-basic-lab-r3-frr pkill -f tcpdump 2>/dev/null || true
          docker exec clab-p4-basic-lab-r2-frr rm -f /tmp/r2_dump.txt
          docker exec clab-p4-basic-lab-r3-frr rm -f /tmp/r3_dump.txt
          docker exec -d clab-p4-basic-lab-r2-frr sh -c "tcpdump -l -n -i eth1 'tcp and (dst port 5201 or dst port 5202)' > /tmp/r2_dump.txt 2>&1"
          docker exec -d clab-p4-basic-lab-r3-frr sh -c "tcpdump -l -n -i eth1 'tcp and (dst port 5201 or dst port 5202)' > /tmp/r3_dump.txt 2>&1"

          # 4. Generowanie 2 przepływów TCP o stałej objętości (-n {{ flow_bytes }}) do pomiaru FCT i przepustowości
          docker exec clab-p4-basic-lab-h1 iperf3 -c {{ target_ip }} -p 5201 -b {{ flow1_rate }} -n {{ flow_bytes }} -l 16K -i 1 --get-server-output --json > "$RUN_DIR/flow1.json" &
          PID1=$!

          sleep {{ stagger_sec }}

          docker exec clab-p4-basic-lab-h1 iperf3 -c {{ target_ip }} -p 5202 -b {{ flow2_rate }} -n {{ flow_bytes }} -l 16K -i 1 --get-server-output --json > "$RUN_DIR/flow2.json" &
          PID2=$!

          sleep 3
          /usr/bin/python3 {{ project_root }}/scripts/fft_dump.py > "$RUN_DIR/fft_snapshot.txt" 2>&1 || true

          wait $PID1 || true
          wait $PID2 || true

          # 5. Pobranie zrzutów tcpdump i analiza serii
          docker exec clab-p4-basic-lab-r2-frr pkill -f tcpdump 2>/dev/null || true
          docker exec clab-p4-basic-lab-r3-frr pkill -f tcpdump 2>/dev/null || true
          docker cp clab-p4-basic-lab-r2-frr:/tmp/r2_dump.txt "$RUN_DIR/tcpdump_r2.txt" || true
          docker cp clab-p4-basic-lab-r3-frr:/tmp/r3_dump.txt "$RUN_DIR/tcpdump_r3.txt" || true

          MPLCONFIGDIR=/tmp/matplotlib /usr/bin/python3 {{ project_root }}/ansible/scripts/analyze_and_plot.py \
            --type throughput \
            --scenario {{ scenario_id }} \
            --mode {{ mode }} \
            --dir "$RUN_DIR" \
            --stagger {{ stagger_sec }}
        done
      args:
        executable: /bin/bash
      register: analysis_out
      changed_when: true

    - name: Podsumowanie statystyczne pomiaru
      ansible.builtin.debug:
        msg: "{{ analysis_out.stdout_lines }}"
