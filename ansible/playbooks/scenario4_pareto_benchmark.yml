---
- name: "Scenariusz 4: Benchmark z artykułu naukowego (500 przepływów UDP Pareto/Poissona)"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    mode: "famtar"
    scenario_id: "scenario4_pareto"
    num_flows: 500
    mean_size_mb: 1.0
    pareto_shape: 1.25
    mean_iat: 0.5
    rate_kbs: 100.0
    pkt_size: 1000
    seed: 42
    max_duration: 250
    target_ip: "10.0.2.1"
    target_port: 5000
    project_root: "{{ (playbook_dir ~ '/../..') | realpath }}"
    results_dir: "{{ project_root }}/results/{{ scenario_id }}_{{ mode }}"

  tasks:
    - name: Wyświetlenie parametrów benchmarku
      ansible.builtin.debug:
        msg: >
          Uruchamianie {{ scenario_id }} | Tryb: {{ mode | upper }} |
          Przepływy: {{ num_flows }} (Pareto mu={{ mean_size_mb }}M, shape={{ pareto_shape }}, IAT={{ mean_iat }}s) |
          Katalog wyników: {{ results_dir }}

    - name: Utworzenie katalogu na wyniki
      ansible.builtin.file:
        path: "{{ results_dir }}"
        state: directory
        mode: "0755"

    - name: Czyszczenie rejestrów P4 (FFT oraz liczników portów) przed testem
      ansible.builtin.shell: |
        for item in "r1:9090" "r2:9091" "r3:9092" "r4:9093"; do
          R="${item%%:*}"
          PORT="${item##*:}"
          docker exec -i "clab-p4-basic-lab-$R" simple_switch_CLI --thrift-port "$PORT" << 'EOF' >/dev/null
        register_reset MyIngress.reg_signature
        register_reset MyIngress.reg_egress_port
        register_reset MyIngress.reg_saved_ttl
        register_reset MyIngress.reg_timestamp
        counter_reset MyIngress.port_bytes_counter
        EOF
        done
      args:
        executable: /bin/bash
      changed_when: true

    - name: Konfiguracja symetrycznych metryk IS-IS (Ścieżka przez r2 = 10, Ścieżka przez r3 = 10)
      ansible.builtin.shell: |
        docker exec clab-p4-basic-lab-r1-frr vtysh -c "conf t" -c "router isis FAMTAR" -c "lsp-gen-interval 1" -c "spf-interval 1" -c "interface eth2" -c "isis metric 10" -c "interface eth3" -c "isis metric 10"
        docker exec clab-p4-basic-lab-r2-frr vtysh -c "conf t" -c "router isis FAMTAR" -c "lsp-gen-interval 1" -c "spf-interval 1" -c "interface eth1" -c "isis metric 10" -c "interface eth2" -c "isis metric 10"
        docker exec clab-p4-basic-lab-r3-frr vtysh -c "conf t" -c "router isis FAMTAR" -c "lsp-gen-interval 1" -c "spf-interval 1" -c "interface eth1" -c "isis metric 10" -c "interface eth2" -c "isis metric 10"
        docker exec clab-p4-basic-lab-r4-frr vtysh -c "conf t" -c "router isis FAMTAR" -c "lsp-gen-interval 1" -c "spf-interval 1" -c "interface eth2" -c "isis metric 10" -c "interface eth3" -c "isis metric 10"
      changed_when: true

    - name: Odczekanie 3 s na zbieżność IS-IS (multipath) i aktualizację tablic P4
      ansible.builtin.pause:
        seconds: 3

    - name: Upewnienie się, że python3 jest zainstalowany na h1 i h2
      ansible.builtin.shell: |
        docker exec clab-p4-basic-lab-h1 which python3 >/dev/null || docker exec clab-p4-basic-lab-h1 apk add --no-cache python3
        docker exec clab-p4-basic-lab-h2 which python3 >/dev/null || docker exec clab-p4-basic-lab-h2 apk add --no-cache python3
      changed_when: false

    - name: Kopiowanie skryptów generatora ruchu na węzły h1 i h2
      ansible.builtin.shell: |
        docker cp {{ project_root }}/scripts/traffic_sender.py clab-p4-basic-lab-h1:/tmp/traffic_sender.py
        docker cp {{ project_root }}/scripts/traffic_receiver.py clab-p4-basic-lab-h2:/tmp/traffic_receiver.py
      changed_when: false

    - name: Czyszczenie starych procesów i plików tymczasowych
      ansible.builtin.shell: |
        docker exec clab-p4-basic-lab-h1 pkill -f traffic_sender.py 2>/dev/null || true
        docker exec clab-p4-basic-lab-h2 pkill -f traffic_receiver.py 2>/dev/null || true
        docker exec clab-p4-basic-lab-r2-frr pkill -f tcpdump 2>/dev/null || true
        docker exec clab-p4-basic-lab-r3-frr pkill -f tcpdump 2>/dev/null || true
        docker exec clab-p4-basic-lab-r2-frr rm -f /tmp/r2_dump.txt
        docker exec clab-p4-basic-lab-r3-frr rm -f /tmp/r3_dump.txt
        docker exec clab-p4-basic-lab-h1 rm -f /tmp/sender_stats.json
        docker exec clab-p4-basic-lab-h2 rm -f /tmp/receiver_stats.json
      changed_when: false

    - name: Uruchomienie nasłuchu tcpdump na r2 (Ścieżka 1) i r3 (Ścieżka 2)
      ansible.builtin.shell: |
        docker exec -d clab-p4-basic-lab-r2-frr sh -c "tcpdump -l -n -tt -i eth1 'udp and dst port {{ target_port }}' > /tmp/r2_dump.txt 2>&1"
        docker exec -d clab-p4-basic-lab-r3-frr sh -c "tcpdump -l -n -tt -i eth1 'udp and dst port {{ target_port }}' > /tmp/r3_dump.txt 2>&1"
      changed_when: false

    - name: Uruchomienie odbiornika ruchu (traffic_receiver.py) w tle na h2
      ansible.builtin.shell: |
        docker exec -d clab-p4-basic-lab-h2 python3 /tmp/traffic_receiver.py \
          --bind 0.0.0.0 \
          --port {{ target_port }} \
          --output /tmp/receiver_stats.json \
          --max-duration {{ (max_duration | int) + 15 }} \
          --idle-timeout 10.0
      changed_when: false

    - name: Odczekanie 1 s na uruchomienie gniazda odbiornika
      ansible.builtin.pause:
        seconds: 1

    - name: Generowanie ruchu 500 przepływów Pareto (traffic_sender.py) na h1
      ansible.builtin.shell: |
        docker exec clab-p4-basic-lab-h1 python3 /tmp/traffic_sender.py \
          --target-ip {{ target_ip }} \
          --target-port {{ target_port }} \
          --num-flows {{ num_flows }} \
          --rate-kbs {{ rate_kbs }} \
          --pkt-size {{ pkt_size }} \
          --mean-size-mb {{ mean_size_mb }} \
          --pareto-shape {{ pareto_shape }} \
          --mean-iat {{ mean_iat }} \
          --seed {{ seed }} \
          --max-duration {{ max_duration }} \
          --output /tmp/sender_stats.json
      changed_when: true

    - name: Odczekanie 3 s na odebranie ostatnich pakietów przez h2
      ansible.builtin.pause:
        seconds: 3

    - name: Zrzut rejestrów FFT do analizy
      ansible.builtin.shell: |
        /usr/bin/python3 {{ project_root }}/scripts/fft_dump.py > {{ results_dir }}/fft_snapshot.txt 2>&1 || true
      changed_when: false

    - name: Zatrzymanie tcpdump i pobranie zrzutów oraz statystyk
      ansible.builtin.shell: |
        docker exec clab-p4-basic-lab-r2-frr pkill -f tcpdump 2>/dev/null || true
        docker exec clab-p4-basic-lab-r3-frr pkill -f tcpdump 2>/dev/null || true
        docker exec clab-p4-basic-lab-h2 pkill -f traffic_receiver.py 2>/dev/null || true
        sleep 1
        docker cp clab-p4-basic-lab-r2-frr:/tmp/r2_dump.txt {{ results_dir }}/tcpdump_r2.txt || true
        docker cp clab-p4-basic-lab-r3-frr:/tmp/r3_dump.txt {{ results_dir }}/tcpdump_r3.txt || true
        docker cp clab-p4-basic-lab-h1:/tmp/sender_stats.json {{ results_dir }}/sender_stats.json || true
        docker cp clab-p4-basic-lab-h2:/tmp/receiver_stats.json {{ results_dir }}/receiver_stats.json || true
      changed_when: false

    - name: Analiza wyników i generowanie wykresów z publikacji
      ansible.builtin.command: >
        /usr/bin/python3 {{ project_root }}/ansible/scripts/analyze_and_plot.py
        --type pareto
        --scenario {{ scenario_id }}
        --mode {{ mode }}
        --dir {{ results_dir }}
      environment:
        MPLCONFIGDIR: "/tmp/matplotlib"
      register: analysis_out
      changed_when: false

    - name: Podsumowanie benchmarku
      ansible.builtin.debug:
        msg: "{{ analysis_out.stdout_lines }}"
