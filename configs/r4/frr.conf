frr version 8.4
frr defaults traditional
hostname r4

interface eth1
 description to_h2
 ip address 10.0.2.254/24
 ip router isis FAMTAR
 isis passive

interface eth2
 description to_r2
 ip address 10.1.24.4/24
 ip router isis FAMTAR
 isis network point-to-point
 isis circuit-type level-2-only
 isis metric 10

interface eth3
 description to_r3
 ip address 10.1.34.4/24
 ip router isis FAMTAR
 isis network point-to-point
 isis circuit-type level-2-only
 isis metric 20

router isis FAMTAR
 net 49.0001.0000.0000.0004.00
 metric-style wide
 is-type level-2-only
