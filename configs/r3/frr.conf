frr version 8.4
frr defaults traditional
hostname r3

interface eth1
 description to_r1
 ip address 10.1.13.2/24
 ip router isis FAMTAR
 isis network point-to-point
 isis circuit-type level-2-only
 isis metric 20

interface eth2
 description to_r4
 ip address 10.1.34.3/24
 ip router isis FAMTAR
 isis network point-to-point
 isis circuit-type level-2-only
 isis metric 20

router isis FAMTAR
 net 49.0001.0000.0000.0003.00
 metric-style wide
 is-type level-2-only
