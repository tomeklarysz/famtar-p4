frr version 8.4
frr defaults traditional
hostname fra

interface eth1
 description to_h2
 ip address 10.0.2.254/24
 ip router isis FAMTAR
 isis passive

interface eth2
 description to_bru
 ip address 10.1.4.3/24
 ip router isis FAMTAR
 isis network point-to-point
 isis circuit-type level-2-only
 no isis hello padding
 isis metric 30

interface eth3
 description to_ham
 ip address 10.1.6.3/24
 ip router isis FAMTAR
 isis network point-to-point
 isis circuit-type level-2-only
 no isis hello padding
 isis metric 38

interface eth4
 description to_mun
 ip address 10.1.7.3/24
 ip router isis FAMTAR
 isis network point-to-point
 isis circuit-type level-2-only
 no isis hello padding
 isis metric 31

interface eth5
 description to_str
 ip address 10.1.8.3/24
 ip router isis FAMTAR
 isis network point-to-point
 isis circuit-type level-2-only
 no isis hello padding
 isis metric 20

router isis FAMTAR
 net 49.0001.0000.0000.0003.00
 metric-style wide
 is-type level-2-only
 lsp-gen-interval 1
 spf-interval 1
