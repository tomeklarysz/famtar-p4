frr version 8.4
frr defaults traditional
hostname zur

interface eth1
 description to_lyo
 ip address 10.1.11.11/24
 ip router isis FAMTAR
 isis network point-to-point
 isis circuit-type level-2-only
 no isis hello padding
 isis metric 36

interface eth2
 description to_mil
 ip address 10.1.13.11/24
 ip router isis FAMTAR
 isis network point-to-point
 isis circuit-type level-2-only
 no isis hello padding
 isis metric 22

interface eth3
 description to_str
 ip address 10.1.15.11/24
 ip router isis FAMTAR
 isis network point-to-point
 isis circuit-type level-2-only
 no isis hello padding
 isis metric 14

router isis FAMTAR
 net 49.0001.0000.0000.0011.00
 metric-style wide
 is-type level-2-only
 lsp-gen-interval 1
 spf-interval 1
