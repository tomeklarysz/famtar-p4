frr version 8.4
frr defaults traditional
hostname par

interface eth1
 description to_h1
 ip address 10.0.1.254/24
 ip router isis FAMTAR
 isis passive

interface eth2
 description to_bru
 ip address 10.1.5.9/24
 ip router isis FAMTAR
 isis network point-to-point
 isis circuit-type level-2-only
 no isis hello padding
 isis metric 26

interface eth3
 description to_lon
 ip address 10.1.9.9/24
 ip router isis FAMTAR
 isis network point-to-point
 isis circuit-type level-2-only
 no isis hello padding
 isis metric 35

interface eth4
 description to_lyo
 ip address 10.1.10.9/24
 ip router isis FAMTAR
 isis network point-to-point
 isis circuit-type level-2-only
 no isis hello padding
 isis metric 38

interface eth5
 description to_str
 ip address 10.1.14.9/24
 ip router isis FAMTAR
 isis network point-to-point
 isis circuit-type level-2-only
 no isis hello padding
 isis metric 39

router isis FAMTAR
 net 49.0001.0000.0000.0009.00
 metric-style wide
 is-type level-2-only
 lsp-gen-interval 1
 spf-interval 1
