frr version 8.4
frr defaults traditional
hostname ams

interface eth1
 description to_bru
 ip address 10.1.1.1/24
 ip router isis FAMTAR
 isis network point-to-point
 isis circuit-type level-2-only
 no isis hello padding
 isis metric 19

interface eth2
 description to_ham
 ip address 10.1.2.1/24
 ip router isis FAMTAR
 isis network point-to-point
 isis circuit-type level-2-only
 no isis hello padding
 isis metric 39

interface eth3
 description to_lon
 ip address 10.1.3.1/24
 ip router isis FAMTAR
 isis network point-to-point
 isis circuit-type level-2-only
 no isis hello padding
 isis metric 33

router isis FAMTAR
 net 49.0001.0000.0000.0001.00
 metric-style wide
 is-type level-2-only
 lsp-gen-interval 1
 spf-interval 1
