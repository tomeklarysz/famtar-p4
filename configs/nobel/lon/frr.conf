frr version 8.4
frr defaults traditional
hostname lon

interface eth1
 description to_ams
 ip address 10.1.3.5/24
 ip router isis FAMTAR
 isis network point-to-point
 isis circuit-type level-2-only
 no isis hello padding
 isis metric 33

interface eth2
 description to_par
 ip address 10.1.9.5/24
 ip router isis FAMTAR
 isis network point-to-point
 isis circuit-type level-2-only
 no isis hello padding
 isis metric 35

router isis FAMTAR
 net 49.0001.0000.0000.0005.00
 metric-style wide
 is-type level-2-only
 lsp-gen-interval 1
 spf-interval 1
