frr version 8.4
frr defaults traditional
hostname mun

interface eth1
 description to_fra
 ip address 10.1.7.8/24
 ip router isis FAMTAR
 isis network point-to-point
 isis circuit-type level-2-only
 no isis hello padding
 isis metric 31

interface eth2
 description to_mil
 ip address 10.1.12.8/24
 ip router isis FAMTAR
 isis network point-to-point
 isis circuit-type level-2-only
 no isis hello padding
 isis metric 35

router isis FAMTAR
 net 49.0001.0000.0000.0008.00
 metric-style wide
 is-type level-2-only
 lsp-gen-interval 1
 spf-interval 1
