frr version 8.4
frr defaults traditional
hostname str

interface eth1
 description to_fra
 ip address 10.1.8.10/24
 ip router isis FAMTAR
 isis network point-to-point
 isis circuit-type level-2-only
 no isis hello padding
 isis metric 20

interface eth2
 description to_par
 ip address 10.1.14.10/24
 ip router isis FAMTAR
 isis network point-to-point
 isis circuit-type level-2-only
 no isis hello padding
 isis metric 39

interface eth3
 description to_zur
 ip address 10.1.15.10/24
 ip router isis FAMTAR
 isis network point-to-point
 isis circuit-type level-2-only
 no isis hello padding
 isis metric 14

router isis FAMTAR
 net 49.0001.0000.0000.0010.00
 metric-style wide
 is-type level-2-only
 lsp-gen-interval 1
 spf-interval 1
