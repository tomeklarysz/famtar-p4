frr version 8.4
frr defaults traditional
hostname bru

interface eth1
 description to_ams
 ip address 10.1.1.2/24
 ip router isis FAMTAR
 isis network point-to-point
 isis circuit-type level-2-only
 no isis hello padding
 isis metric 19

interface eth2
 description to_fra
 ip address 10.1.4.2/24
 ip router isis FAMTAR
 isis network point-to-point
 isis circuit-type level-2-only
 no isis hello padding
 isis metric 30

interface eth3
 description to_par
 ip address 10.1.5.2/24
 ip router isis FAMTAR
 isis network point-to-point
 isis circuit-type level-2-only
 no isis hello padding
 isis metric 26

router isis FAMTAR
 net 49.0001.0000.0000.0002.00
 metric-style wide
 is-type level-2-only
 lsp-gen-interval 1
 spf-interval 1
