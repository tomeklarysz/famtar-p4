frr version 8.4
frr defaults traditional
hostname lyo

interface eth1
 description to_par
 ip address 10.1.10.6/24
 ip router isis FAMTAR
 isis network point-to-point
 isis circuit-type level-2-only
 no isis hello padding
 isis metric 38

interface eth2
 description to_zur
 ip address 10.1.11.6/24
 ip router isis FAMTAR
 isis network point-to-point
 isis circuit-type level-2-only
 no isis hello padding
 isis metric 36

router isis FAMTAR
 net 49.0001.0000.0000.0006.00
 metric-style wide
 is-type level-2-only
 lsp-gen-interval 1
 spf-interval 1
