frr version 8.4
frr defaults traditional
hostname mil

interface eth1
 description to_mun
 ip address 10.1.12.7/24
 ip router isis FAMTAR
 isis network point-to-point
 isis circuit-type level-2-only
 no isis hello padding
 isis metric 35

interface eth2
 description to_zur
 ip address 10.1.13.7/24
 ip router isis FAMTAR
 isis network point-to-point
 isis circuit-type level-2-only
 no isis hello padding
 isis metric 22

router isis FAMTAR
 net 49.0001.0000.0000.0007.00
 metric-style wide
 is-type level-2-only
 lsp-gen-interval 1
 spf-interval 1
