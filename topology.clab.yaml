name: p4-basic-lab

topology:
  nodes:
    r1:
      kind: linux
      image: p4lang/behavioral-model:latest
      mgmt-ipv4: 172.20.20.4
      binds:
        - basic_forwarding.json:/root/basic_forwarding.json
      cmd: >
        bash -c "sleep 1 &&
        simple_switch_grpc
        --log-console
        --thrift-port 9090
        --device-id 1
        -i 1@eth1 -i 2@eth2
        /root/basic_forwarding.json
        --
        --grpc-server-addr 0.0.0.0:9559"

    r2:
      kind: linux
      image: p4lang/behavioral-model:latest
      mgmt-ipv4: 172.20.20.5
      binds:
        - basic_forwarding.json:/root/basic_forwarding.json
      cmd: >
        bash -c "sleep 1 &&
        simple_switch_grpc
        --log-console
        --thrift-port 9091
        --device-id 2
        -i 1@eth1 -i 2@eth2
        /root/basic_forwarding.json
        --
        --grpc-server-addr 0.0.0.0:9559"

    h1:
      kind: linux
      image: alpine:latest
      cmd: sleep infinity
      exec:
        - ip link set dev eth1 address 00:00:00:00:01:01
        - ip addr add 10.0.1.1/24 dev eth1
        - ip route add 10.0.2.0/24 via 10.0.1.254

    h2:
      kind: linux
      image: alpine:latest
      cmd: sleep infinity
      exec:
        - ip link set dev eth1 address 00:00:00:00:02:02
        - ip addr add 10.0.2.1/24 dev eth1
        - ip route add 10.0.1.0/24 via 10.0.2.254

  links:
    - endpoints: ["h1:eth1", "r1:eth1"]
      vars:
        macs: ["00:00:00:00:01:01", "00:00:00:00:00:01"]
    - endpoints: ["r1:eth2", "r2:eth1"]
      vars:
        macs: ["00:00:00:00:00:02", "00:00:00:00:00:03"]
    - endpoints: ["r2:eth2", "h2:eth1"]
      vars:
        macs: ["00:00:00:00:00:04", "00:00:00:00:02:02"]
      