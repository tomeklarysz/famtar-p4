name: p4-basic-lab

topology:
  nodes:
    r1:
      kind: linux
      image: p4lang/behavioral-model:latest
      mgmt-ipv4: 172.20.20.4
      binds:
        - basic_forwarding.json:/root/basic_forwarding.json
      sysctls:
        net.ipv4.ip_forward: 0
        net.ipv6.conf.all.forwarding: 0
      exec:
        - sysctl -qw net.ipv4.ip_forward=0 net.ipv6.conf.all.forwarding=0
      cmd: >
        bash -c "sleep 1 &&
        simple_switch_grpc
        --log-console
        --thrift-port 9090
        --device-id 1
        -i 1@eth1 -i 2@eth2 -i 3@eth3
        /root/basic_forwarding.json
        --
        --grpc-server-addr 0.0.0.0:9559"

    r1-frr:
      kind: linux
      image: frrouting/frr:latest
      network-mode: container:r1
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/r1/frr.conf:/etc/frr/frr.conf
      exec:
        - sysctl -qw net.ipv4.ip_forward=0 net.ipv6.conf.all.forwarding=0
        - iptables -A OUTPUT -p icmp --icmp-type destination-unreachable -j DROP
        - tc qdisc replace dev eth2 root tbf rate 10mbit burst 64kb latency 50ms
        - tc qdisc replace dev eth3 root tbf rate 10mbit burst 64kb latency 50ms

    r2:
      kind: linux
      image: p4lang/behavioral-model:latest
      mgmt-ipv4: 172.20.20.5
      binds:
        - basic_forwarding.json:/root/basic_forwarding.json
      sysctls:
        net.ipv4.ip_forward: 0
        net.ipv6.conf.all.forwarding: 0
      exec:
        - sysctl -qw net.ipv4.ip_forward=0 net.ipv6.conf.all.forwarding=0
      cmd: >
        bash -c "sleep 1 &&
        simple_switch_grpc
        --log-console
        --thrift-port 9091
        --device-id 2
        -i 1@eth1 -i 2@eth2
        /root/basic_forwarding.json
        --
        --grpc-server-addr 0.0.0.0:9559"

    r2-frr:
      kind: linux
      image: frrouting/frr:latest
      network-mode: container:r2
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/r2/frr.conf:/etc/frr/frr.conf
      exec:
        - sysctl -qw net.ipv4.ip_forward=0 net.ipv6.conf.all.forwarding=0
        - iptables -A OUTPUT -p icmp --icmp-type destination-unreachable -j DROP
        - tc qdisc replace dev eth2 root tbf rate 10mbit burst 64kb latency 50ms

    r3:
      kind: linux
      image: p4lang/behavioral-model:latest
      mgmt-ipv4: 172.20.20.6
      binds:
        - basic_forwarding.json:/root/basic_forwarding.json
      sysctls:
        net.ipv4.ip_forward: 0
        net.ipv6.conf.all.forwarding: 0
      exec:
        - sysctl -qw net.ipv4.ip_forward=0 net.ipv6.conf.all.forwarding=0
      cmd: >
        bash -c "sleep 1 &&
        simple_switch_grpc
        --log-console
        --thrift-port 9092
        --device-id 3
        -i 1@eth1 -i 2@eth2
        /root/basic_forwarding.json
        --
        --grpc-server-addr 0.0.0.0:9559"

    r3-frr:
      kind: linux
      image: frrouting/frr:latest
      network-mode: container:r3
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/r3/frr.conf:/etc/frr/frr.conf
      exec:
        - sysctl -qw net.ipv4.ip_forward=0 net.ipv6.conf.all.forwarding=0
        - iptables -A OUTPUT -p icmp --icmp-type destination-unreachable -j DROP
        - tc qdisc replace dev eth2 root tbf rate 10mbit burst 64kb latency 50ms

    r4:
      kind: linux
      image: p4lang/behavioral-model:latest
      mgmt-ipv4: 172.20.20.7
      binds:
        - basic_forwarding.json:/root/basic_forwarding.json
      sysctls:
        net.ipv4.ip_forward: 0
        net.ipv6.conf.all.forwarding: 0
      exec:
        - sysctl -qw net.ipv4.ip_forward=0 net.ipv6.conf.all.forwarding=0
      cmd: >
        bash -c "sleep 1 &&
        simple_switch_grpc
        --log-console
        --thrift-port 9093
        --device-id 4
        -i 1@eth1 -i 2@eth2 -i 3@eth3
        /root/basic_forwarding.json
        --
        --grpc-server-addr 0.0.0.0:9559"

    r4-frr:
      kind: linux
      image: frrouting/frr:latest
      network-mode: container:r4
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/r4/frr.conf:/etc/frr/frr.conf
      exec:
        - sysctl -qw net.ipv4.ip_forward=0 net.ipv6.conf.all.forwarding=0
        - iptables -A OUTPUT -p icmp --icmp-type destination-unreachable -j DROP

    h1:
      kind: linux
      image: alpine:latest
      cmd: sleep infinity
      exec:
        - ip addr add 10.0.1.1/24 dev eth1
        - ip route add 10.0.0.0/8 via 10.0.1.254
        - arp -s 10.0.1.254 00:00:00:00:00:01

    h2:
      kind: linux
      image: alpine:latest
      cmd: sleep infinity
      exec:
        - ip addr add 10.0.2.1/24 dev eth1
        - ip route add 10.0.0.0/8 via 10.0.2.254
        - arp -s 10.0.2.254 00:00:00:00:00:04

  links:
    - type: veth
      endpoints:
        - node: h1
          interface: eth1
          mac: 00:00:00:00:01:01
        - node: r1
          interface: eth1
          mac: 00:00:00:00:00:01
    - type: veth
      endpoints:
        - node: r1
          interface: eth2
          mac: 00:00:00:00:00:12
        - node: r2
          interface: eth1
          mac: 00:00:00:00:00:21
    - type: veth
      endpoints:
        - node: r1
          interface: eth3
          mac: 00:00:00:00:00:13
        - node: r3
          interface: eth1
          mac: 00:00:00:00:00:31
    - type: veth
      endpoints:
        - node: r2
          interface: eth2
          mac: 00:00:00:00:00:24
        - node: r4
          interface: eth2
          mac: 00:00:00:00:00:42
    - type: veth
      endpoints:
        - node: r3
          interface: eth2
          mac: 00:00:00:00:00:34
        - node: r4
          interface: eth3
          mac: 00:00:00:00:00:43
    - type: veth
      endpoints:
        - node: r4
          interface: eth1
          mac: 00:00:00:00:00:04
        - node: h2
          interface: eth1
          mac: 00:00:00:00:02:02
